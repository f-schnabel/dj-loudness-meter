name: Release build

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ddf0518c31a259dcc359fd4c7bcb1ce8a27e9855
          path: .vcpkg
      - name: Bootstrap vcpkg
        shell: pwsh
        run: ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Publish
        shell: pwsh
        run: ./scripts/Publish.ps1 -VcpkgRoot ./.vcpkg
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = "build-$env:GITHUB_RUN_NUMBER"
          gh release create $releaseTag `
            "publish/win-x64/DjLoudnessMeter.exe#DjLoudnessMeter.exe" `
            "LICENSE#LICENSE" `
            "THIRD-PARTY-NOTICES.md#THIRD-PARTY-NOTICES.md" `
            --target $env:GITHUB_SHA `
            --generate-notes `
            --title "DJ Loudness Meter $releaseTag"
