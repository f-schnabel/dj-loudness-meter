name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
      - name: Publish
        shell: pwsh
        run: ./scripts/Publish.ps1 -VcpkgRoot $env:VCPKG_ROOT
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          "publish/win-x64/DjLoudnessMeter.exe#DjLoudnessMeter.exe"
          "publish/win-x64/ebur128.dll#ebur128.dll"
          "LICENSE#LICENSE"
          "THIRD-PARTY-NOTICES.md#THIRD-PARTY-NOTICES.md"
          --verify-tag
          --generate-notes
          --title "DJ Loudness Meter $env:GITHUB_REF_NAME"
