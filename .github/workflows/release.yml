name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
      - name: Bundle libebur128
        shell: pwsh
        run: ./scripts/Build-Native.ps1 -VcpkgRoot $env:VCPKG_ROOT
      - name: Restore
        run: dotnet restore DjLoudnessMeter.sln -p:Platform=x64 -r win-x64 -p:SelfContained=true --locked-mode
      - name: Test
        run: dotnet test DjLoudnessMeter.sln -c Release -p:Platform=x64 --no-restore
      - name: Publish
        run: dotnet publish DjLoudnessMeter/DjLoudnessMeter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64 --no-restore
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          "publish/win-x64/DjLoudnessMeter.exe#DjLoudnessMeter.exe"
          "LICENSE#LICENSE"
          "THIRD-PARTY-NOTICES.md#THIRD-PARTY-NOTICES.md"
          --verify-tag
          --generate-notes
          --title "DJ Loudness Meter $env:GITHUB_REF_NAME"
